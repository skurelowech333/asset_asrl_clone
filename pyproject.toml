[build-system]
requires = [
    "scikit-build-core",
    "cmake>=3.16",
    "ninja",
    "pybind11",
    "setuptools>=62.0",
    "wheel"
]
build-backend = "scikit_build_core.build"


[project]
name = "asset-asrl-dev"
version = "0.5.2"
description = "Astrodynamics Software and Science Enabling Toolkit"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "Apache 2.0"}
authors = [{name = "James B. Pezent et al."}]

dependencies = [
    "scipy",
    "numpy",
    "matplotlib",
    "spiceypy",
    "seaborn",
    "basemap",
    "intel-openmp",
    "mkl"
]


# ----------------------------
# PACKAGE DISCOVERY (CRITICAL FIX)
# ----------------------------
[tool.setuptools.packages.find]
where = ["."]
include = ["asset_asrl*"]


# ----------------------------
# OPTIONAL DEPENDENCIES
# ----------------------------
[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.12.0",
    "sphinx>=4.0.0",
    "breathe>=4.26.0",
    "furo>=2021.8.0",
    "cython>=0.29.0",
    "black>=21.0",
    "flake8>=3.9.0",
    "mypy>=0.900"
]

docs = [
    "sphinx>=4.0.0",
    "breathe>=4.26.0",
    "furo>=2021.8.0"
]

test = [
    "pytest>=6.0",
    "pytest-cov>=2.12.0"
]

cython = [
    "cython>=0.29.0"
]

analysis = [
    "scipy>=1.6.0",
    "pandas>=1.2.0",
    "scikit-learn>=0.24.0",
    "jupyter>=1.0.0"
]


# ----------------------------
# SCIKIT-BUILD CONFIG (FIXED)
# ----------------------------
[tool.scikit-build]
cmake.version = ">=3.16"
cmake.build-type = "Release"